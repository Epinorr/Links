<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لینک‌های شبکه‌های اجتماعی</title>
    
    <!-- فونت انگلیسی مدرن برای نام پروفایل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- آیکون‌های FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @font-face {
            font-family: 'YekanBakh';
            src: url('Yekan Bakh FaNum 05 Medium.woff') format('woff');
        }

        body {
            font-family: 'YekanBakh', Tahoma, sans-serif;
            background-color: #050508; 
            margin: 0;
            overflow-x: hidden;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* کلاس اختصاصی فونت انگلیسی برای نام */
        .creator-name {
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.05em; /* کمی فاصله‌گذاری برای لوکس‌تر شدن */
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(20, 20, 25, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .social-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent; 
        }

        .social-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--brand-color);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.4s ease;
            border-radius: inherit;
        }

        .social-btn:hover::before, .social-btn.force-hover::before {
            opacity: 0.15; 
        }

        .social-btn:hover, .social-btn.force-hover {
            box-shadow: 0 15px 30px -5px var(--brand-color-shadow), 0 0 15px rgba(0,0,0,0.5);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .social-btn:hover .icon-container, .social-btn.force-hover .icon-container {
            transform: scale(1.15) rotate(-5deg);
            background: var(--brand-color);
            border-color: var(--brand-color);
            box-shadow: 0 0 20px var(--brand-color-shadow);
        }

        .social-btn:hover .icon-container i, 
        .social-btn.force-hover .icon-container i {
            color: #fff;
        }

        /* استایل اختصاصی هاور برای SVG (مثل دکمه Kick) */
        .social-btn:hover .icon-container svg,
        .social-btn.force-hover .icon-container svg {
            color: #fff;
        }

        .icon-container {
            transition: all 0.4s ease;
        }

        .social-btn[data-status="off"] {
            display: none !important;
        }

        .profile-glow {
            position: relative;
        }
        
        .profile-glow::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #53fc18, #00f2fe, #ff0000, #2AABEE, #E1306C, #53fc18);
            z-index: -1;
            filter: blur(15px);
            opacity: 0.7;
            animation: spinGlow 6s linear infinite;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <canvas id="bg-canvas"></canvas>

    <main class="w-full max-w-md glass-panel rounded-[2rem] p-8 relative z-10 fade-in-up" style="animation-delay: 0.1s;">
        
        <header class="flex flex-col items-center text-center mb-10">
            <div class="profile-glow mb-6 fade-in-up" style="animation-delay: 0.2s;">
                <img src="logo.jpg" onerror="this.src='https://placehold.co/400x400/1e293b/ffffff?text=Logo'" alt="لوگوی شما" class="w-28 h-28 rounded-full border-2 border-white/10 object-cover shadow-2xl relative z-10 bg-[#0f172a]">
            </div>
            
            <!-- نام شما با فونت انگلیسی و کلاس جدید -->
            <h1 class="creator-name text-3xl font-extrabold text-white fade-in-up" style="animation-delay: 0.3s;" dir="ltr">
                EPINOR
            </h1>
        </header>

        <nav class="flex flex-col gap-4 w-full">
            
            <a href="https://t.me/EPINORR" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #2AABEE; --brand-color-shadow: rgba(42, 171, 238, 0.4); animation-delay: 0.4s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-telegram text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">تلگرام</span>
                </div>
            </a>

            <a href="https://instagram.com/epin0r" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #E1306C; --brand-color-shadow: rgba(225, 48, 108, 0.4); animation-delay: 0.5s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-instagram text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">اینستاگرام</span>
                </div>
            </a>

            <a href="https://youtube.com/@epinorr" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #FF0000; --brand-color-shadow: rgba(255, 0, 0, 0.4); animation-delay: 0.6s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-youtube text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">یوتیوب</span>
                </div>
            </a>

            <a href="https://kick.com/epinor" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #53fc18; --brand-color-shadow: rgba(83, 252, 24, 0.4); animation-delay: 0.7s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center ml-4 text-slate-200">
                    <svg class="w-6 h-6" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" clip-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2">
                        <path d="M37 .036h164.448v113.621h54.71v-56.82h54.731V.036h164.448v170.777h-54.73v56.82h-54.711v56.8h54.71v56.82h54.73V512.03H310.89v-56.82h-54.73v-56.8h-54.711v113.62H37V.036z" fill="currentColor" style="transition: fill 0.4s ease;"/>
                    </svg>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">کیک</span>
                </div>
            </a>

            <a href="#" target="_blank" data-status="off" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #00f2fe; --brand-color-shadow: rgba(0, 242, 254, 0.4); animation-delay: 0.8s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-tiktok text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">تیک‌تاک</span>
                </div>
            </a>

        </nav>
    </main>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('bg-canvas');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.05);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3, 12);

            const renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                alpha: true,
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const geometry = new THREE.PlaneGeometry(40, 40, 100, 100);
            const material = new THREE.MeshStandardMaterial({
                color: 0x0a0a12,
                roughness: 0.3,
                metalness: 0.8,
                wireframe: false
            });

            const plane = new THREE.Mesh(geometry, material);
            plane.rotation.x = -Math.PI / 2; 
            plane.position.y = -2;
            scene.add(plane);

            const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.5);
            scene.add(ambientLight);

            const light1 = new THREE.PointLight(0xE1306C, 8, 25); 
            const light2 = new THREE.PointLight(0x00f2fe, 8, 25); 
            const light3 = new THREE.PointLight(0x53fc18, 5, 25); 
            scene.add(light1, light2, light3);

            let mouseX = 0;
            let mouseY = 0;
            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX) / windowHalfX;
                mouseY = (event.clientY - windowHalfY) / windowHalfY;
            });

            const clock = new THREE.Clock();
            const positionAttribute = geometry.attributes.position;

            function animate() {
                requestAnimationFrame(animate);
                const t = clock.getElapsedTime() * 0.4;

                light1.position.x = Math.sin(t * 0.8) * 8;
                light1.position.z = Math.cos(t * 0.5) * 8;
                light1.position.y = Math.sin(t * 0.3) * 2 + 1;

                light2.position.x = Math.cos(t * 0.6) * 8;
                light2.position.z = Math.sin(t * 0.7) * 8;
                light2.position.y = Math.cos(t * 0.4) * 2 + 1;

                light3.position.x = Math.sin(t * 0.9) * 8;
                light3.position.z = Math.sin(t * 0.9) * 8;
                light3.position.y = Math.cos(t * 0.6) * 2 + 1;

                for (let i = 0; i < positionAttribute.count; i++) {
                    const x = positionAttribute.getX(i);
                    const y = positionAttribute.getY(i);
                    
                    const wave1 = Math.sin(x * 0.2 + t) * 0.5;
                    const wave2 = Math.cos(y * 0.2 + t) * 0.5;
                    const wave3 = Math.sin((x + y) * 0.1 - t) * 0.5;
                    
                    positionAttribute.setZ(i, wave1 + wave2 + wave3);
                }
                positionAttribute.needsUpdate = true;

                camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.02;
                camera.position.y += (-mouseY * 1.0 + 3 - camera.position.y) * 0.02;
                camera.lookAt(scene.position);

                renderer.render(scene, camera);
            }
            
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            const buttons = document.querySelectorAll('.social-btn');

            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    if(button.getAttribute('data-status') === 'off') return;
                    
                    const href = this.getAttribute('href');
                    const target = this.getAttribute('target') || '_self';
                    
                    if (href && href !== '#') {
                        e.preventDefault(); 
                        
                        this.style.transform = ''; 
                        this.classList.add('force-hover');
                        
                        setTimeout(() => {
                            this.classList.remove('force-hover');
                            if (target === '_blank') {
                                window.open(href, '_blank');
                            } else {
                                window.location.href = href;
                            }
                        }, 400); 
                    }
                });

                button.addEventListener('mousemove', (e) => {
                    if(button.getAttribute('data-status') === 'off') return;
                    // غیرفعال کردن افکت سه‌بعدی اگر عرض صفحه کوچک بود (تشخیص موبایل/تبلت)
                    if (window.innerWidth <= 768) return; 

                    const rect = button.getBoundingClientRect();
                    const x = e.clientX - rect.left; 
                    const y = e.clientY - rect.top;  
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -8; 
                    const rotateY = ((x - centerX) / centerX) * 8;
                    
                    button.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });

                button.addEventListener('mouseleave', () => {
                    button.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                });
            });
        };
    </script>
</body>
</html>
