<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لینک‌های شبکه‌های اجتماعی</title>
    
    <!-- 
        راهنمای فونت اختصاصی: 
        در حال حاضر از فونت زیبای وزیرمتن استفاده شده است. 
        اگر می‌خواهید از فایل فونتی که خودتان دارید (مثلا Yekan Bakh) استفاده کنید، 
        فایل فونت را در پوشه گیت‌هاب خود قرار دهید و کد زیر را از حالت کامنت خارج کرده و آدرس فایل را بدهید:
        
        @font-face {
            font-family: 'MyCustomFont';
            src: url('fonts/YekanBakh-Medium.woff2') format('woff2');
        }
    -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- آیکون‌های FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            /* اگر فونت اختصاصی گذاشتید، نام آن را اینجا جایگزین Vazirmatn کنید */
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #030305; /* پس‌زمینه بسیار تاریک برای درخشش Three.js */
            margin: 0;
            overflow-x: hidden;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(20, 20, 25, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .social-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            text-decoration: none;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--brand-color);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.4s ease;
            border-radius: inherit;
        }

        .social-btn:hover::before {
            opacity: 0.15; 
        }

        .social-btn:hover {
            box-shadow: 0 15px 30px -5px var(--brand-color-shadow), 0 0 15px rgba(0,0,0,0.5);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .social-btn:hover .icon-container {
            transform: scale(1.15) rotate(-5deg);
            background: var(--brand-color);
            border-color: var(--brand-color);
            box-shadow: 0 0 20px var(--brand-color-shadow);
        }

        .social-btn:hover .icon-container i, 
        .social-btn:hover .icon-container svg path {
            color: #fff;
            fill: #fff; /* برای کیک */
        }

        .icon-container {
            transition: all 0.4s ease;
        }

        /* سیستم پنهان کردن دکمه‌ها بر اساس data-status */
        .social-btn[data-status="off"] {
            display: none !important;
        }

        .profile-glow {
            position: relative;
        }
        
        .profile-glow::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #53fc18, #00f2fe, #ff0000, #2AABEE, #E1306C, #53fc18);
            z-index: -1;
            filter: blur(15px);
            opacity: 0.7;
            animation: spinGlow 6s linear infinite;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <!-- بوم Three.js -->
    <canvas id="bg-canvas"></canvas>

    <main class="w-full max-w-md glass-panel rounded-[2rem] p-8 relative z-10 fade-in-up" style="animation-delay: 0.1s;">
        
        <!-- بخش پروفایل -->
        <header class="flex flex-col items-center text-center mb-10">
            <div class="profile-glow mb-6 fade-in-up" style="animation-delay: 0.2s;">
                <img src="https://placehold.co/400x400/1e293b/ffffff?text=Avatar" alt="تصویر پروفایل" class="w-28 h-28 rounded-full border-2 border-white/10 object-cover shadow-2xl relative z-10 bg-[#0f172a]">
            </div>
            
            <h1 class="text-2xl font-bold tracking-tight text-white fade-in-up" style="animation-delay: 0.3s;">
                نام شما
            </h1>
        </header>

        <!-- 
            برای غیب کردن هر دکمه، مقدار data-status را به "off" تغییر دهید.
        -->
        <nav class="flex flex-col gap-4 w-full">
            
            <!-- Telegram -->
            <a href="https://t.me/EPINORR" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #2AABEE; --brand-color-shadow: rgba(42, 171, 238, 0.4); animation-delay: 0.4s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-telegram text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">تلگرام</span>
                </div>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/epin0r" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #E1306C; --brand-color-shadow: rgba(225, 48, 108, 0.4); animation-delay: 0.5s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-instagram text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">اینستاگرام</span>
                </div>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@epinorr" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #FF0000; --brand-color-shadow: rgba(255, 0, 0, 0.4); animation-delay: 0.6s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-youtube text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">یوتیوب</span>
                </div>
            </a>

            <!-- Kick (با استفاده از SVG اختصاصی کاربر) -->
            <a href="https://kick.com/epinor" target="_blank" data-status="on" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #53fc18; --brand-color-shadow: rgba(83, 252, 24, 0.4); animation-delay: 0.7s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center ml-4">
                    <svg class="w-6 h-6 text-slate-200" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" clip-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2">
                        <path d="M37 .036h164.448v113.621h54.71v-56.82h54.731V.036h164.448v170.777h-54.73v56.82h-54.711v56.8h54.71v56.82h54.73V512.03H310.89v-56.82h-54.73v-56.8h-54.711v113.62H37V.036z" fill="currentColor" style="transition: fill 0.4s ease;"/>
                    </svg>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">کیک</span>
                </div>
            </a>

            <!-- TikTok -->
            <a href="#" target="_blank" data-status="off" class="social-btn fade-in-up flex items-center p-3 rounded-2xl bg-white/5 border border-white/5" style="--brand-color: #00f2fe; --brand-color-shadow: rgba(0, 242, 254, 0.4); animation-delay: 0.8s;">
                <div class="icon-container w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl ml-4">
                    <i class="fa-brands fa-tiktok text-slate-200"></i>
                </div>
                <div class="flex-1 text-right">
                    <span class="font-semibold text-lg text-white">تیک‌تاک</span>
                </div>
            </a>

        </nav>
    </main>

    <script>
        window.onload = function() {
            // --- 1. تنظیمات اولیه Three.js ---
            const canvas = document.getElementById('bg-canvas');
            const scene = new THREE.Scene();
            
            // اضافه کردن مِه برای عمق دادن به فضا
            scene.fog = new THREE.FogExp2(0x030305, 0.001);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            const renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                alpha: true,
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // --- 2. خلق ذرات (Particles) فضایی ---
            const particlesCount = 3000;
            const positions = new Float32Array(particlesCount * 3);
            const colors = new Float32Array(particlesCount * 3);
            const sizes = new Float32Array(particlesCount);

            const colorPalette = [
                new THREE.Color('#4facfe'), // آبی روشن (تیک‌تاک/تلگرام)
                new THREE.Color('#53fc18'), // سبز (کیک)
                new THREE.Color('#E1306C'), // صورتی (اینستاگرام)
                new THREE.Color('#ffffff')  // سفید ستاره‌ای
            ];

            for(let i = 0; i < particlesCount * 3; i+=3) {
                // پخش پارتیکل‌ها در یک فضای کروی گسترده
                const r = 200 * Math.cbrt(Math.random());
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos(2 * Math.random() - 1);
                
                positions[i] = r * Math.sin(phi) * Math.cos(theta);
                positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i+2] = r * Math.cos(phi);

                // انتخاب تصادفی رنگ از پالت
                const randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i] = randomColor.r;
                colors[i+1] = randomColor.g;
                colors[i+2] = randomColor.b;

                // سایزهای متغیر برای ستاره‌ها
                sizes[i/3] = Math.random() * 2;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // استفاده از ShaderMaterial برای داشتن کنترل بهتر روی درخشندگی ذرات
            const material = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending // حالت Additive برای نورانی شدن تقاطع‌ها
            });

            const particlesMesh = new THREE.Points(geometry, material);
            scene.add(particlesMesh);

            // --- 3. تعامل با موس ---
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;

            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();

                // چرخش بسیار آرام و روان فضا
                particlesMesh.rotation.y = elapsedTime * 0.03;
                particlesMesh.rotation.x = elapsedTime * 0.01;

                // افکت Parallax (حرکت فضا بر اساس موقعیت موس با نرمی بالا)
                targetX = mouseX * 0.05;
                targetY = mouseY * 0.05;
                
                camera.position.x += (targetX - camera.position.x) * 0.02;
                camera.position.y += (-targetY - camera.position.y) * 0.02;
                camera.lookAt(scene.position);

                renderer.render(scene, camera);
            }
            
            animate();

            // واکنش به تغییر سایز صفحه
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // --- 4. افکت سه‌بعدی Tilt روی دکمه‌ها ---
            const buttons = document.querySelectorAll('.social-btn');

            buttons.forEach(button => {
                button.addEventListener('mousemove', (e) => {
                    // فقط اگر دکمه مخفی نبود افکت را اجرا کن
                    if(button.getAttribute('data-status') === 'off') return;

                    const rect = button.getBoundingClientRect();
                    const x = e.clientX - rect.left; 
                    const y = e.clientY - rect.top;  
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    // محاسبه زاویه چرخش (ظریف و نرم)
                    const rotateX = ((y - centerY) / centerY) * -8; 
                    const rotateY = ((x - centerX) / centerX) * 8;
                    
                    button.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });

                button.addEventListener('mouseleave', () => {
                    button.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                });
            });
        };
    </script>
</body>
</html>
